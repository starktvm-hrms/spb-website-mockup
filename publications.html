<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publications</title>
<meta name="description" content="Economic Reviews, Five-Year and Annual Plans, evaluation studies and guidelines from the Kerala State Planning Board.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/site.js"></script>
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="phead"><div class="container">
    <div class="crumbs"><a href="index.html">Home</a> / Publications</div>
    <h1>Publications</h1>
    <p>Economic Reviews, plan documents, evaluation studies and guidelines, free to read and download.</p>
  </div></section>
  <section class="section"><div class="container">
    <div class="filters" id="filters" role="group" aria-label="Filter publications"></div>
    <div class="list" id="list"></div>
  </div></section>
</main>
<div id="site-footer"></div>
<script>
(function(){
  var S=window.SPB,kind='All',q='';
  var kinds=['All'].concat(S.PUBS.map(function(p){return p.k}).filter(function(k,i,a){return a.indexOf(k)===i}));
  var fl=document.getElementById('filters'),list=document.getElementById('list');
  function paint(){
    fl.querySelectorAll('.chip').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.k===kind))});
    var L=S.PUBS.filter(function(p){return(kind==='All'||p.k===kind)&&(!q||(p.t+' '+p.d).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.y-a.y});
    list.innerHTML=L.length?L.map(S.pubHTML).join(''):'<div class="card" style="padding:2rem;text-align:center;color:var(--muted)">No publications match your search.</div>';
  }
  kinds.forEach(function(k){var b=document.createElement('button');b.type='button';b.className='chip';b.dataset.k=k;b.textContent=k;b.onclick=function(){kind=k;paint()};fl.append(b);});
  var inp=document.createElement('input');inp.type='search';inp.placeholder='Search publications';inp.setAttribute('aria-label','Search publications');
  inp.oninput=function(){q=inp.value.trim().toLowerCase();paint()};fl.append(inp);
  paint();
})();
</script>
</body>
</html>
