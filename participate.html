<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Have Your Say</title>
<meta name="description" content="Kerala Plan: share concerns, ideas and opinions with the State Planning Board.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/site.js"></script>
<style>
/* Forum layout, carried over from the Kerala Plan page: topics | feed | about. */
.fwrap{display:grid;grid-template-columns:14.5rem minmax(0,1fr) 17rem;gap:1.25rem;max-width:var(--max);margin:0 auto;padding-block:1.25rem 3rem;padding-left:var(--gut);padding-right:var(--gut)}
.col{min-width:0}
nav.topics{position:sticky;top:6.2rem;padding:.5rem;align-self:start}
nav.topics h2,.fside h2{font:600 .7rem/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:.6rem .6rem .5rem}
nav.topics a{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:.4rem;text-decoration:none;color:var(--ink);font-size:.92rem}
nav.topics a:hover{background:var(--bg)}
nav.topics a[aria-current="page"]{background:var(--accent-soft);font-weight:600}
nav.topics .n{margin-left:auto;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.feedhead{padding:1rem 1.1rem;margin-bottom:.8rem}
.feedhead h1{font:800 1.6rem/1.15 var(--font-display);margin:0 0 .25rem;letter-spacing:-.01em;text-wrap:balance}
.feedhead p{margin:0;color:var(--muted);max-width:60ch}
.asks{margin-top:.8rem;padding:.6rem .8rem;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:.45rem;font-weight:500}
.asks span{display:block;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar{display:flex;align-items:center;gap:.4rem;margin-bottom:.8rem;flex-wrap:wrap}
.bar .tab{border:0;background:none;padding:.35rem .8rem;border-radius:999px;color:var(--muted);font-weight:600}
.bar .tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar input{flex:1 1 12rem;min-width:0;margin-left:auto;max-width:18rem;padding:.4rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.composer{padding:.9rem 1.1rem;margin-bottom:.8rem}
.composer .open{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:.5rem;padding:.65rem .9rem;color:var(--muted)}
.composer form{display:grid;gap:.7rem}
.seg{display:flex;gap:.35rem;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.25rem .8rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.actions{display:flex;gap:.5rem;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.hint{font-size:.75rem;color:var(--muted);margin-right:auto}
.post{display:grid;grid-template-columns:2.8rem minmax(0,1fr);margin-bottom:.7rem;overflow:hidden}
.vote{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.7rem 0;background:var(--bg);font-variant-numeric:tabular-nums;font-weight:600}
.vote button{border:0;background:none;padding:.1rem .35rem;color:var(--muted);line-height:0;border-radius:.3rem}
.vote button svg{width:1rem;height:1rem}
.vote button:hover{color:var(--ink)}
.vote button[aria-pressed="true"].up,.cv button[aria-pressed="true"].up{color:var(--accent)}
.vote button[aria-pressed="true"].down,.cv button[aria-pressed="true"].down{color:var(--danger)}
.pb{padding:.75rem 1rem .6rem;min-width:0}
.meta .cat{display:inline-flex;align-items:center;gap:.35rem;font-weight:600;color:var(--ink);text-decoration:none}
.flair{padding:.05rem .5rem;border-radius:999px;font-size:.7rem;font-weight:600;border:1px solid currentColor}
.flair.Concern{color:var(--danger)} .flair.Idea{color:var(--accent)} .flair.Opinion{color:var(--muted)} .flair.Question{color:var(--gold)}
.post h3{font:600 1.05rem/1.3 var(--font-display);margin:.35rem 0 .3rem;overflow-wrap:anywhere;text-wrap:balance}
.body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}
.body.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pfoot{display:flex;gap:.3rem;margin-top:.5rem}
.pfoot button{border:0;background:none;color:var(--muted);font-weight:600;padding:.25rem .5rem;border-radius:.35rem;font-size:.8rem}
.pfoot button:hover{background:var(--bg);color:var(--ink)}
.pfoot .del{color:var(--danger)}
.thread{border-top:1px solid var(--line);margin-top:.5rem;padding-top:.7rem;display:grid;gap:.75rem}
.cm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1rem .6rem}
.cv{display:flex;flex-direction:column;align-items:center;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.cv button{border:0;background:none;padding:0;line-height:0;color:var(--muted)}
.cv svg{width:.85rem;height:.85rem}
.cm p{margin:.1rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .replies{grid-column:2;display:grid;gap:.7rem;margin-top:.5rem;padding-left:.8rem;border-left:2px solid var(--line)}
.cform{display:grid;gap:.5rem}
.cform textarea{width:100%;min-height:4.2rem;padding:.5rem .65rem;border:1px solid var(--line);border-radius:.45rem;background:var(--bg);resize:vertical}
.cform .actions label{font-size:.8rem;display:flex;gap:.35rem;align-items:center;margin-right:auto}
.empty{padding:2rem 1.2rem;text-align:center}
.empty h3{font:800 1.2rem var(--font-display);margin:0 0 .4rem}
.empty p{margin:0 auto;color:var(--muted);max-width:44ch}
.fside{display:grid;gap:.8rem;align-content:start}
.fside .card{padding:.9rem 1rem}
.fside p{margin:.2rem 0 0;color:var(--muted)}
.fside ul{margin:.4rem 0 0;padding-left:1.1rem;color:var(--muted)}
.fside li{margin-bottom:.3rem}
.fstats{display:flex;gap:1.2rem;margin-top:.6rem}
.fstats b{display:block;font:800 1.4rem/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.fstats span{font-size:.72rem;color:var(--muted)}
.fside label{display:flex;gap:.45rem;align-items:center;font-size:.85rem;margin-top:.5rem}
@media (max-width:1020px){
  .fwrap{grid-template-columns:13rem minmax(0,1fr)}
  .fside{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
}
@media (max-width:720px){
  .fwrap{grid-template-columns:minmax(0,1fr);gap:.8rem}
  nav.topics{position:static;display:flex;overflow-x:auto;gap:.3rem;padding:.4rem}
  nav.topics h2{display:none}
  nav.topics a{flex:none;white-space:nowrap;border:1px solid var(--line)}
  nav.topics .n{margin-left:.2rem}
  .bar input{max-width:none;flex-basis:100%;order:5}
}
</style>
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="phead"><div class="container">
  <div class="crumbs"><a href="index.html">Home</a> / Have your say</div>
  <h1>Kerala Plan · Have your say</h1>
  <p class="ml" style="color:var(--gold);font-weight:600;margin-bottom:.4rem">കേരള പ്ലാൻ · നിങ്ങളുടെ അഭിപ്രായം</p>
  <p>Share a concern, an idea or an opinion. Name your panchayat or ward so the Board can act on it.</p>
</div></section>
<div class="fwrap">
  <nav class="topics card col" id="nav" aria-label="Topics"></nav>
  <div class="col">
    <section class="feedhead card" id="head"></section>
    <section class="composer card" id="composer"></section>
    <div class="bar" id="bar"></div>
    <div id="feed"></div>
  </div>
  <aside class="fside col" id="side"></aside>
</div>
</main>
<div id="site-footer"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* ---------- local demo data store ----------
   The original Kerala Plan page used a shared database provided by its host.
   For this static mockup the same API (collection/add/doc/set/delete/onSnapshot)
   is backed by localStorage and seeded with sample posts. Swap LocalDB for a
   real backend (e.g. a REST API) to go live. */
var LocalDB=(function(){
  var KEY='spb-kerala-plan-v1',subs={},data;
  var H=36e5,now=Date.now();
  function seed(){return{
    posts:[
      {id:'p1',cat:'water',flair:'Concern',title:'Pipe water comes only twice a week in our ward in summer',body:'From March to May, the JJM tap connection in ward 7 gets water only on Tuesdays and Fridays. Families depend on tanker lorries. Can the plan include a new overhead tank for the ward?',district:'Palakkad',author:'u1',ts:now-5*H},
      {id:'p2',cat:'environment',flair:'Idea',title:'Map every culvert before the monsoon so blocked drains get cleared in time',body:'Most flooding in our town starts at a handful of blocked culverts. If each ward sabha mapped them and volunteers reported blockages on a simple app, the municipality could clear them before June.',district:'Ernakulam',author:'u2',ts:now-26*H},
      {id:'p3',cat:'education',flair:'Question',title:'Will government colleges get more seats in new-age courses?',body:'Many students in our district travel to Bengaluru for data science and AI courses. Are there plans to add these programmes in government and aided colleges here?',district:'Kannur',author:'u3',ts:now-50*H},
      {id:'p4',cat:'food',flair:'Idea',title:'Weekly farmers’ market at every panchayat office',body:'A covered space once a week where local farmers can sell vegetables directly would cut middlemen and give us fresher food.',district:'Thrissur',author:'u4',ts:now-80*H},
      {id:'p5',cat:'roads',flair:'Concern',title:'No KSRTC bus after 8 pm on the hill route',body:'Workers returning from town have no bus after 8 pm. Autos charge ₹400. Even one late service would help hundreds of people.',district:'Idukki',author:'u5',ts:now-120*H},
      {id:'p6',cat:'health',flair:'Opinion',title:'Our family health centre is excellent: please fund more staff, not more buildings',body:'The FHC near us has a great doctor but only one. Queues are long by 9 am. Staff matter more than new buildings.',district:'Kollam',author:'u6',ts:now-150*H}
    ],
    comments:[
      {id:'c1',post:'p1',parent:null,body:'Same in ward 9. The problem is the pump house capacity, not the pipes.',author:'u4',ts:now-4*H,board:false},
      {id:'c2',post:'p1',parent:'c1',body:'Thank you both. We have shared this with the Palakkad District Planning Committee and the water working group for the Annual Plan 2027-28.',author:'board',ts:now-2*H,board:true},
      {id:'c3',post:'p2',parent:null,body:'Our residents’ association already does this informally. Happy to share our map.',author:'u6',ts:now-20*H,board:false}
    ],
    votes:[{id:'p1__u2',t:'p1',u:'u2',v:1},{id:'p1__u3',t:'p1',u:'u3',v:1},{id:'p1__u4',t:'p1',u:'u4',v:1},{id:'p2__u1',t:'p2',u:'u1',v:1},{id:'p2__u3',t:'p2',u:'u3',v:1},{id:'p2__u5',t:'p2',u:'u5',v:1},{id:'p2__u6',t:'p2',u:'u6',v:1},{id:'p4__u1',t:'p4',u:'u1',v:1},{id:'p4__u2',t:'p4',u:'u2',v:1},{id:'p6__u2',t:'p6',u:'u2',v:1},{id:'p5__u3',t:'p5',u:'u3',v:1},{id:'c2__u1',t:'c2',u:'u1',v:1}]
  };}
  try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!data||!data.posts)data=seed();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  function snap(name){return{docs:(data[name]||[]).map(function(o){return{id:o.id,data:function(){return Object.assign({},o)}}})}}
  function emit(name){save();(subs[name]||[]).forEach(function(f){f(snap(name))});}
  function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
  return{
    names:{u1:'Anitha R.',u2:'Rahul M.',u3:'Fathima K.',u4:'Joseph T.',u5:'Suresh P.',u6:'Lakshmi N.'},
    reset:function(){data=seed();['posts','comments','votes'].forEach(emit);},
    collection:function(name){
      data[name]=data[name]||[];
      return{
        add:async function(o){var d=Object.assign({},o,{id:uid()});data[name].push(d);emit(name);return d;},
        doc:function(id){return{
          set:async function(o){data[name]=data[name].filter(function(x){return x.id!==id});data[name].push(Object.assign({},o,{id:id}));emit(name);},
          delete:async function(){data[name]=data[name].filter(function(x){return x.id!==id});emit(name);}
        }},
        onSnapshot:function(f){(subs[name]=subs[name]||[]).push(f);setTimeout(function(){f(snap(name))},0);}
      };
    }
  };
})();
</script>

<script>
(function(){
var CATS=SPB.CATS,CAT=SPB.CAT,DISTRICTS=SPB.DISTRICTS;
var FLAIRS=['Concern','Idea','Opinion','Question'];
var S={db:null,uid:null,canEdit:false,posts:[],comments:[],votes:[],ready:false,
  route:'all',sort:'hot',q:'',names:{},open:{},replying:null,drafts:{},asBoard:false,flair:'Concern',composing:false,score:{},mine:{},ccount:{}};

function h(tag,attrs){
  var e=document.createElement(tag);attrs=attrs||{};
  for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++){add(e,arguments[i]);}
  return e;
}
function add(e,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(e,x)});return;}e.append(c.nodeType?c:document.createTextNode(c));}
function $(s){return document.querySelector(s)}
var UP='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3l6 8H2z" fill="currentColor"/></svg>';
var DOWN='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13L2 5h12z" fill="currentColor"/></svg>';
function icon(html){var s=document.createElement('span');s.innerHTML=html;return s.firstChild;}
function ago(ts){var s=(Date.now()-ts)/1000;if(s<60)return'just now';var m=s/60;if(m<60)return Math.floor(m)+' min ago';var hr=m/60;if(hr<24)return Math.floor(hr)+' h ago';var d=hr/24;if(d<30)return Math.floor(d)+' d ago';return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3200);}
function who(id){return id===S.uid?'You':(S.names[id]||'A citizen');}
function canMod(x){return !!S.uid&&(x.author===S.uid||S.canEdit);}

function derive(){
  S.score={};S.mine={};S.ccount={};
  S.votes.forEach(function(v){S.score[v.t]=(S.score[v.t]||0)+v.v;if(v.u===S.uid)S.mine[v.t]=v.v;});
  S.comments.forEach(function(c){S.ccount[c.post]=(S.ccount[c.post]||0)+1;});
}
function docs(snap){return snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});}
var pending=false;
function render(){
  var a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&$('#feed').contains(a)){if(!pending){pending=true;setTimeout(function(){pending=false;render()},900);}return;}
  derive();renderNav();renderHead();renderBar();renderFeed();renderComposer();renderSide();
}

async function vote(t,val){
  var ref=S.db.collection('votes').doc(t+'__'+S.uid);
  try{if(S.mine[t]===val)await ref.delete();else await ref.set({t:t,u:S.uid,v:val});}
  catch(e){toast('Could not save your vote. Try again.');}
}
async function addComment(post,parent,text,board){
  text=text.trim();if(text.length<2){toast('Write a comment first.');return false;}
  try{await S.db.collection('comments').add({post:post,parent:parent||null,body:text.slice(0,2000),author:S.uid,ts:Date.now(),board:!!(board&&S.canEdit)});return true;}
  catch(e){toast('Could not post your comment.');return false;}
}
async function delPost(p){
  var cs=S.comments.filter(function(c){return c.post===p.id});
  await Promise.all(cs.map(function(c){return S.db.collection('comments').doc(c.id).delete()}));
  await S.db.collection('posts').doc(p.id).delete();toast('Post deleted.');
}
async function delComment(c){
  var kids=S.comments.filter(function(x){return x.parent===c.id});
  await Promise.all(kids.map(function(x){return S.db.collection('comments').doc(x.id).delete()}));
  await S.db.collection('comments').doc(c.id).delete();
}

function renderNav(){
  var counts={all:S.posts.length};S.posts.forEach(function(p){counts[p.cat]=(counts[p.cat]||0)+1;});
  var nav=$('#nav');nav.textContent='';
  nav.append(h('h2',null,'Topics'));
  nav.append(h('a',{href:'#all','aria-current':S.route==='all'?'page':null},h('span',{class:'dot',style:'background:var(--gold)'}),'All posts',h('span',{class:'n'},String(counts.all||0))));
  CATS.forEach(function(c){
    nav.append(h('a',{href:'#'+c.id,'aria-current':S.route===c.id?'page':null},h('span',{class:'dot',style:'--h:'+c.h}),c.name,h('span',{class:'n'},String(counts[c.id]||0))));
  });
}
function renderHead(){
  var hd=$('#head');hd.textContent='';
  if(S.route==='all'){
    hd.append(h('h1',null,'All posts'),h('p',null,'Share a concern, an idea or an opinion on the things that shape daily life: your plate, your commute, your classroom, your hospital, your village. The State Planning Board reads it here.'));
  }else{
    var c=CAT[S.route];
    hd.append(h('h1',null,c.name),h('p',null,c.blurb),h('div',{class:'asks'},h('span',null,'Question for you'),c.ask));
  }
}
function renderBar(){
  var bar=$('#bar');
  if(!bar.dataset.built){
    bar.dataset.built='1';
    [['hot','Hot'],['new','New'],['top','Top']].forEach(function(s){
      bar.append(h('button',{class:'tab',type:'button','data-s':s[0],onclick:function(){S.sort=s[0];render();}},s[1]));
    });
    var q=h('input',{type:'search',placeholder:'Search posts, places','aria-label':'Search posts'});
    q.addEventListener('input',function(){S.q=q.value.trim();derive();renderFeed();});
    bar.append(q);
  }
  bar.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-pressed',String(S.sort===b.dataset.s))});
}
function visible(){
  var L=S.posts.filter(function(p){return S.route==='all'||p.cat===S.route;});
  if(S.q){var q=S.q.toLowerCase();L=L.filter(function(p){return((p.title||'')+' '+(p.body||'')+' '+(p.district||'')).toLowerCase().indexOf(q)>-1;});}
  var now=Date.now();
  function sc(p){return S.score[p.id]||0}
  function hot(p){return(sc(p)+1+0.5*(S.ccount[p.id]||0))/Math.pow((now-p.ts)/36e5+2,1.4);}
  if(S.sort==='new')L.sort(function(a,b){return b.ts-a.ts});
  else if(S.sort==='top')L.sort(function(a,b){return sc(b)-sc(a)||b.ts-a.ts});
  else L.sort(function(a,b){return hot(b)-hot(a)});
  return L;
}
function voteBox(id,cls){
  var m=S.mine[id]||0;
  var up=h('button',{class:'up',type:'button','aria-label':'Upvote','aria-pressed':String(m===1),onclick:function(){vote(id,1)}});up.append(icon(UP));
  var dn=h('button',{class:'down',type:'button','aria-label':'Downvote','aria-pressed':String(m===-1),onclick:function(){vote(id,-1)}});dn.append(icon(DOWN));
  return h('div',{class:cls},up,h('span',{'aria-label':'Score'},String(S.score[id]||0)),dn);
}
function draftArea(key,ph){
  var t=h('textarea',{placeholder:ph,'aria-label':ph,maxlength:'2000'});
  t.value=S.drafts[key]||'';
  t.addEventListener('input',function(){S.drafts[key]=t.value;});
  return t;
}
function commentForm(post,parent,key,ph){
  var ta=draftArea(key,ph);
  var chk=S.canEdit?h('label',null,h('input',{type:'checkbox',checked:S.asBoard,onchange:function(e){S.asBoard=e.target.checked}}),'Reply as State Planning Board'):null;
  var btn=h('button',{class:'btn primary sm',type:'button',onclick:async function(){
    btn.disabled=true;
    var ok=await addComment(post,parent,ta.value,S.asBoard);
    btn.disabled=false;
    if(ok){S.drafts[key]='';ta.value='';ta.blur();if(parent)S.replying=null;render();}
  }},parent?'Reply':'Comment');
  return h('div',{class:'cform'},ta,h('div',{class:'actions'},chk,btn));
}
function commentNode(c,post){
  var kids=S.comments.filter(function(x){return x.parent===c.id}).sort(function(a,b){return a.ts-b.ts});
  var head=h('div',{class:'meta'},h('b',{style:'color:var(--ink)'},c.board?'State Planning Board':who(c.author)),c.board?h('span',{class:'badge'},'Official'):null,'·',ago(c.ts));
  var acts=h('div',{class:'pfoot',style:'margin-top:.1rem'});
  if(!c.parent)acts.append(h('button',{type:'button',onclick:function(){S.replying=(S.replying===c.id?null:c.id);render();}},'Reply'));
  if(canMod(c))acts.append(h('button',{class:'del',type:'button',onclick:function(){delComment(c)}},'Delete'));
  var box=h('div',{class:'cm'},voteBox(c.id,'cv'),h('div',null,head,h('p',null,c.body),acts));
  var rep=h('div',{class:'replies'});
  kids.forEach(function(k){rep.append(commentNode(k,post));});
  if(S.replying===c.id)rep.append(commentForm(post.id,c.id,'r:'+c.id,'Write a reply'));
  if(rep.children.length)box.append(rep);
  return box;
}
function postNode(p){
  var c=CAT[p.cat]||{name:'General',h:160};
  var open=!!S.open[p.id];
  var n=S.ccount[p.id]||0;
  var meta=h('div',{class:'meta'},
    h('a',{class:'cat',href:'#'+p.cat},h('span',{class:'dot',style:'--h:'+c.h}),c.name),
    h('span',{class:'flair '+(p.flair||'Opinion')},p.flair||'Opinion'),
    p.district?h('span',null,p.district):null,
    h('span',null,'· '+who(p.author)+' · '+ago(p.ts)));
  var body=p.body?h('p',{class:'body'+(open?'':' clamp')},p.body):null;
  var foot=h('div',{class:'pfoot'},
    h('button',{type:'button','aria-expanded':String(open),onclick:function(){S.open[p.id]=!open;render();}},n+(n===1?' comment':' comments')),
    canMod(p)?h('button',{class:'del',type:'button',onclick:function(){delPost(p)}},'Delete'):null);
  var pb=h('div',{class:'pb'},meta,h('h3',null,p.title),body,foot);
  if(open){
    var th=h('div',{class:'thread'});
    th.append(commentForm(p.id,null,'c:'+p.id,'Add a comment'));
    S.comments.filter(function(x){return x.post===p.id&&!x.parent}).sort(function(a,b){return a.ts-b.ts}).forEach(function(x){th.append(commentNode(x,p));});
    pb.append(th);
  }
  return h('article',{class:'post card'},voteBox(p.id,'vote'),pb);
}
function renderFeed(){
  var f=$('#feed');f.textContent='';
  if(!S.ready){return;}
  var L=visible();
  if(!L.length){
    var c=CAT[S.route];
    if(S.q){f.append(h('div',{class:'empty card'},h('h3',null,'No matches'),h('p',null,'Nothing matches “'+S.q+'”. Try a place name or a shorter word.')));}
    else f.append(h('div',{class:'empty card'},
      h('h3',null,c?'No posts in '+c.name+' yet':'No posts yet'),
      h('p',null,c?c.ask+' Be the first to answer.':'Pick a topic and start the first conversation. Name your panchayat or ward so the Board can act on it.'),
      h('div',{style:'margin-top:1rem'},h('button',{class:'btn primary',type:'button',onclick:openComposer},'Write a post'))));
    return;
  }
  L.forEach(function(p){f.append(postNode(p));});
}
function renderSide(){
  var s=$('#side');s.textContent='';
  var staff=h('input',{type:'checkbox',checked:S.canEdit,onchange:function(e){S.canEdit=e.target.checked;try{localStorage.setItem('spb-staff',S.canEdit?'1':'')}catch(x){}render();}});
  s.append(
    h('div',{class:'card'},h('h2',{style:'margin:0 0 .3rem'},'About Kerala Plan'),
      h('p',null,'The State Planning Board shapes roads, schools, hospitals, water and more. This is where you tell it what daily life looks like on the ground.'),
      h('div',{class:'fstats'},h('div',null,h('b',null,String(S.posts.length)),h('span',null,'posts')),h('div',null,h('b',null,String(S.comments.length)),h('span',null,'comments')))),
    h('div',{class:'card'},h('h2',{style:'margin:0 0 .3rem'},'House rules'),
      h('ul',null,h('li',null,'Be specific: name the place, ward or panchayat.'),h('li',null,'Criticise schemes and decisions, not people.'),h('li',null,'Do not share phone numbers or home addresses.'),h('li',null,'Replies marked Official come from the Board.'))),
    h('div',{class:'card'},h('h2',{style:'margin:0 0 .3rem'},'Demo controls'),
      h('p',null,'This mockup stores posts in your browser only.'),
      h('label',null,staff,'Preview as Board staff'),
      h('button',{class:'btn sm',type:'button',style:'margin-top:.6rem',onclick:function(){LocalDB.reset();toast('Sample posts restored.');}},'Reset sample posts'))
  );
}

function openComposer(){S.composing=true;renderComposer();var t=$('#ptitle');if(t)t.focus();$('#composer').scrollIntoView({block:'center'});}
var F={};
function renderComposer(){
  var box=$('#composer');
  if(!S.composing){
    if(box.dataset.mode==='closed')return;
    box.textContent='';box.dataset.mode='closed';
    box.append(h('button',{class:'open',type:'button',onclick:openComposer},'Share a concern, idea or opinion…'));
    return;
  }
  if(box.dataset.mode==='open'){var sel=$('#pcat');if(sel&&S.route!=='all'&&!F.touched)sel.value=S.route;return;}
  box.dataset.mode='open';box.textContent='';
  var cat=h('select',{id:'pcat'});CATS.forEach(function(c){cat.append(h('option',{value:c.id},c.name));});
  cat.value=S.route!=='all'?S.route:'water';cat.addEventListener('change',function(){F.touched=true});
  var dist=h('select',{id:'pdist'},h('option',{value:''},'Not specified'));DISTRICTS.forEach(function(d){dist.append(h('option',{value:d},d));});
  var title=h('input',{id:'ptitle',maxlength:'140',placeholder:'A clear, specific title'});
  var body=h('textarea',{id:'pbody',maxlength:'4000',placeholder:'What is happening, where, and what would you like the Board to consider?'});
  var seg=h('div',{class:'seg',role:'group','aria-label':'Type of post'});
  function paintSeg(){seg.textContent='';FLAIRS.forEach(function(f){seg.append(h('button',{type:'button','aria-pressed':String(S.flair===f),onclick:function(){S.flair=f;paintSeg();}},f));});}
  paintSeg();
  var go=h('button',{class:'btn primary',type:'submit'},'Post');
  var form=h('form',{novalidate:true},
    h('div',{class:'row'},h('div',{class:'field'},h('label',{for:'pcat'},'Topic'),cat),h('div',{class:'field'},h('label',{for:'pdist'},'District'),dist)),
    h('div',{class:'field'},h('label',null,'Type'),seg),
    h('div',{class:'field'},h('label',{for:'ptitle'},'Title'),title),
    h('div',{class:'field'},h('label',{for:'pbody'},'Details'),body),
    h('div',{class:'actions'},h('span',{class:'hint'},'Posts are visible to everyone who visits this page.'),
      h('button',{class:'btn',type:'button',onclick:function(){S.composing=false;F.touched=false;renderComposer();}},'Cancel'),go));
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    var t=title.value.trim();
    if(t.length<6){toast('Add a short title of at least 6 characters.');title.focus();return;}
    go.disabled=true;
    await S.db.collection('posts').add({cat:cat.value,flair:S.flair,title:t,body:body.value.trim(),district:dist.value,author:S.uid,ts:Date.now()});
    toast('Posted to '+CAT[cat.value].name+'.');
    var target=cat.value;S.composing=false;F.touched=false;document.activeElement.blur();
    if(S.route!=='all'&&S.route!==target)location.hash='#'+target;else render();
    renderComposer();
  });
  box.append(form);
}

function route(){var r=location.hash.slice(1);S.route=CAT[r]?r:'all';render();}
window.addEventListener('hashchange',function(){route();window.scrollTo({top:$('.fwrap').offsetTop-90});});

S.db=LocalDB;S.uid='me';S.names=LocalDB.names;S.names.board='State Planning Board';
try{S.canEdit=localStorage.getItem('spb-staff')==='1'}catch(e){}
S.db.collection('posts').onSnapshot(function(s){S.posts=docs(s);S.ready=true;render();});
S.db.collection('comments').onSnapshot(function(s){S.comments=docs(s);render();});
S.db.collection('votes').onSnapshot(function(s){S.votes=docs(s);render();});
route();
})();
</script>
</body>
</html>
